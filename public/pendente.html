<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento em processamento — ZAP STORE</title>
<style>
  :root { --primary:#0d2b6b; --accent:#25d366; --bg:#f4f6f9; --muted:#6b7a89; --border:#e3e8ee; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:#1e2a35;
         margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 2px 10px rgba(20,40,60,.08);
          max-width:420px; width:100%; padding:2.4rem 1.8rem; text-align:center; }
  .marca { font-size:2.6rem; line-height:1; }
  h1 { color:var(--primary); font-size:1.25rem; margin:14px 0 8px; }
  p { color:var(--muted); font-size:.92rem; line-height:1.6; margin:0; }
  a { display:inline-block; margin-top:22px; background:var(--primary); color:#fff; text-decoration:none;
      font-weight:700; font-size:.92rem; padding:12px 22px; border-radius:10px; }
  a:hover { filter:brightness(.93); }
  a:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="marca">⏳</div>
    <h1>Pagamento em processamento</h1>
    <p>Pix costuma cair em minutos; boleto leva até 3 dias úteis. Assim que for confirmado, separamos seu pedido.</p>
    <a href="/">Voltar à loja</a>
  </div>
</body>
</html>
